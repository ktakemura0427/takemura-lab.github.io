name: Deploy Jekyll with GitHub Pages dependencies preinstalled
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Rubyのバージョンを 3.1 に指定（Jekyll 3.9との互換性のため）
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ./blog
      # 1. Jekyllのビルド
      - name: Build with Jekyll
        working-directory: ./blog
        run: bundle exec jekyll build --destination ../_jekyll_out
      # 2. ルートのプレーンサイトを _site へコピー
      - name: Copy plain site
        run: |
          mkdir -p _site
          cp -r ./* ./_site/ 2>/dev/null || true
          rm -rf ./_site/blog ./_site/_site ./_site/_jekyll_out
      # 3. ビルドしたJekyll成果物を _site/blog/ へ結合
      - name: Merge Jekyll build into _site/blog
        run: |
          mkdir -p ./_site/blog
          cp -r ./_jekyll_out/* ./_site/blog/
      # 4. アップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
